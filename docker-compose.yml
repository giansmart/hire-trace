services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hiretrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hiretrace}
      POSTGRES_DB: ${POSTGRES_DB:-hiretrace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hiretrace}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
