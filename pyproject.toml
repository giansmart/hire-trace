[project]
name = "hire-trace"
version = "0.1.0"
description = "Recruitment trust intelligence through open-source data and knowledge graphs"
readme = "README.md"
authors = [
    { name = "Giancarlo", email = "giancarlo.poemape@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
